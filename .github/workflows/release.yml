name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [[ "$GOOGLE_SERVICES_JSON" == "{"* ]]; then
            echo "Detected raw JSON"
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Detected Base64"
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          echo "File size created: $(wc -c < app/google-services.json) bytes"

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/tictactoe.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/tictactoe.apk
          name: Release ${{ github.ref_name }}
          body: |
            Firebase Multiplayer Update
            - Migrated online multiplayer to Firebase.
            - Improved stability and UI.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
